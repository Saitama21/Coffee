<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#34170f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Coffee Pay</title><style>*{box-sizing:border-box}body{margin:0;background:#1a100e;color:#fff0db;font:16px system-ui,-apple-system;min-height:100dvh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,420px);padding:36px 24px;background:#301e19;border:1px solid #705044;border-radius:30px;text-align:center;box-shadow:0 20px 70px #0007}.logo{width:112px;height:112px;border-radius:26px}h1{font-size:30px;margin:16px 0 4px}p{color:#cbb5a5}.code{font-size:46px;letter-spacing:6px;font-weight:800;margin:28px 0}button,a{width:100%;display:block;border:0;border-radius:17px;padding:19px 12px;font:700 16px system-ui;text-decoration:none;cursor:pointer}button{background:#f7d7a8;color:#301e19}a{background:#554039;color:white;margin-top:12px}.hint{font-size:13px;line-height:1.5;margin-top:22px}</style></head><body><main class="panel"><img class="logo" src="./icon.svg" alt="Coffee Pay"><h1>Coffee Pay</h1><p>Кофейный автомат</p><div class="code">602625</div><button id="pay">Скопировать код и открыть оплату</button><a href="https://pay.prostopay.net/">Открыть ProstoPay</a><p class="hint" id="status">Вставь код в поле на сайте и нажми OK.</p></main><script>document.getElementById('pay').addEventListener('click',async()=>{try{await navigator.clipboard.writeText('602625');document.getElementById('status').textContent='Код скопирован'}catch(e){document.getElementById('status').textContent='Код: 602625'}location.href='https://pay.prostopay.net/'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
